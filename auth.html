<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authentication page</title>
    <link
      href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <script
      src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.js"
      defer
    ></script>

    <div class="container max-w-full mx-auto py-24 px-6">
      <div class="max-w-sm mx-auto px-6">
        <div class="relative flex flex-wrap">
          <div class="w-full relative">
            <div class="mt-6">
              <div
                class="mb-5 pb-1border-b-2 text-center font-base text-gray-700"
              >
                <a
                  class="items-center hover:no-underline font-bold text-gray-800 text-xl uppercase"
                  href="index.html"
                >
                  ohitsgood
                </a>
              </div>
              <div class="text-sm text-center font-semibold">
                Lorem ipsum dolor, sit amet?
              </div>

              <form class="mt-8" action="user.html">
                <div class="mx-auto max-w-lg">
                  <div class="py-2">
                    <span class="px-1 text-sm text-gray-600">Username</span>
                    <input
                      placeholder=""
                      type="text"
                      class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
                    />
                  </div>
                  <div class="py-2" x-data="{ show: true }">
                    <span class="px-1 text-sm text-gray-600">Password</span>
                    <div class="relative">
                      <input
                        placeholder=""
                        :type="show ? 'password' : 'text'"
                        class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
                      />
                      <div
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5"
                      >
                        <svg
                          class="h-6 text-gray-700"
                          fill="none"
                          @click="show = !show"
                          :class="{'hidden': !show, 'block':show }"
                          xmlns="http://www.w3.org/2000/svg"
                          viewbox="0 0 576 512"
                        >
                          <path
                            fill="currentColor"
                            d="M572.52 241.4C518.29 135.59 410.93 64 288 64S57.68 135.64 3.48 241.41a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.32-71.64 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400a144 144 0 1 1 144-144 143.93 143.93 0 0 1-144 144zm0-240a95.31 95.31 0 0 0-25.31 3.79 47.85 47.85 0 0 1-66.9 66.9A95.78 95.78 0 1 0 288 160z"
                          ></path>
                        </svg>

                        <svg
                          class="h-6 text-gray-700"
                          fill="none"
                          @click="show = !show"
                          :class="{'block': !show, 'hidden':show }"
                          xmlns="http://www.w3.org/2000/svg"
                          viewbox="0 0 640 512"
                        >
                          <path
                            fill="currentColor"
                            d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z"
                          ></path>
                        </svg>
                      </div>
                    </div>
                  </div>
                  <div class="flex justify-between">
                    <label class="block text-gray-500 font-bold my-4"
                      ><input
                        type="checkbox"
                        class="leading-loose text-pink-600"
                      />
                      <span class="py-2 text-sm text-gray-600 leading-snug">
                        Nhớ tài khoản cho lần sau
                      </span></label
                    >
                  </div>
                  <button
                    class="mt-3 text-lg font-semibold w-full text-white rounded-lg px-6 py-3 btn-hover gradient-black"
                  >
                    Đăng nhập
                  </button>
                  <div
                    class="flex flex-col flex-wrap content-center text-center"
                  >
                    <label class="block text-gray-500 font-bold my-4"
                      ><a
                        href="#"
                        class="cursor-pointer tracking-tighter border-b-2 border-gray-400 hover:border-gray-600"
                        ><span>Quên mật khẩu?</span></a
                      ></label
                    >
                    <div class="text-sm font-semibold block sm:hidden py-3">
                      <a href="#" class="font-normal"
                        >Bạn chưa có tài khoản?
                        <br />
                        <span
                          class="font-semibold border-b-2 border-gray-400 hover:border-teal-500"
                        >
                          Đăng ký ở đây nè
                        </span>
                      </a>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End login tab -->

    <div class="container max-w-full mx-auto py-24 px-6">
      <div class="max-w-sm mx-auto px-6">
        <div class="relative flex flex-wrap">
          <div class="w-full relative">
            <div
              class="mb-5 pb-1border-b-2 text-center font-base text-gray-700"
            >
              <a
                class="items-center hover:no-underline font-bold text-gray-800 text-xl uppercase"
                href="index.html"
              >
                ohitsgood
              </a>
            </div>
            <div class="md:mt-6">
              <div class="text-center font-semibold">Lorem ipsum dolor</div>
              <div class="text-center font-base">Sed ut perspiciatis unde?</div>
              <form class="mt-8" x-data="{password: '',password_confirm: ''}">
                <div class="mx-auto max-w-lg">
                  <div class="py-1">
                    <span class="px-1 text-sm text-gray-600">Username</span>
                    <input
                      placeholder=""
                      type="text"
                      class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
                    />
                  </div>
                  <div class="py-1">
                    <span class="px-1 text-sm text-gray-600">Email</span>
                    <input
                      placeholder=""
                      type="email"
                      class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
                    />
                  </div>
                  <div class="py-1">
                    <span class="px-1 text-sm text-gray-600">Password</span>
                    <input
                      placeholder=""
                      type="password"
                      x-model="password"
                      class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
                    />
                  </div>
                  <div class="py-1">
                    <span class="px-1 text-sm text-gray-600"
                      >Password Confirm</span
                    >
                    <input
                      placeholder=""
                      type="password"
                      x-model="password_confirm"
                      class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
                    />
                  </div>
                  <div class="flex justify-start mt-3 ml-4 p-1">
                    <ul>
                      <li class="flex items-center py-1">
                        <div
                          :class="{'bg-green-200 text-green-700': password == password_confirm && password.length > 0, 'bg-red-200 text-red-700':password != password_confirm || password.length == 0}"
                          class="rounded-full p-1 fill-current"
                        >
                          <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                          >
                            <path
                              x-show="password == password_confirm && password.length > 0"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M5 13l4 4L19 7"
                            />
                            <path
                              x-show="password != password_confirm || password.length == 0"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M6 18L18 6M6 6l12 12"
                            />
                          </svg>
                        </div>
                        <span
                          :class="{'text-green-700': password == password_confirm && password.length > 0, 'text-red-700':password != password_confirm || password.length == 0}"
                          class="font-medium text-sm ml-3"
                          x-text="password == password_confirm && password.length > 0 ? 'Passwords match' : 'Passwords do not match' "
                        ></span>
                      </li>
                      <li class="flex items-center py-1">
                        <div
                          :class="{'bg-green-200 text-green-700': password.length > 7, 'bg-red-200 text-red-700':password.length < 7 }"
                          class="rounded-full p-1 fill-current"
                        >
                          <svg
                            class="w-4 h-4"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                          >
                            <path
                              x-show="password.length > 7"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M5 13l4 4L19 7"
                            />
                            <path
                              x-show="password.length < 7"
                              stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M6 18L18 6M6 6l12 12"
                            />
                          </svg>
                        </div>
                        <span
                          :class="{'text-green-700': password.length > 7, 'text-red-700':password.length < 7 }"
                          class="font-medium text-sm ml-3"
                          x-text="password.length > 7 ? 'The minimum length is reached' : 'At least 8 characters required' "
                        ></span>
                      </li>
                    </ul>
                  </div>
                  <div class="flex justify-start">
                    <label
                      class="block text-gray-500 font-bold my-4 flex items-center"
                    >
                      <input
                        class="leading-loose text-pink-600 top-0"
                        type="checkbox"
                      />
                      <span class="ml-2 text-sm py-2 text-gray-600 text-left"
                        >Accept the
                        <a
                          href="#"
                          class="font-semibold border-b-2 border-gray-200 hover:border-gray-500 text-black"
                        >
                          Terms and Conditions of the site </a
                        >and
                        <a
                          href="#"
                          class="font-semibold border-b-2 border-gray-200 hover:border-gray-500 text-black"
                        >
                          the information data policy.</a
                        >
                      </span>
                    </label>
                  </div>
                  <button
                    class="mt-3 text-lg font-semibold w-full text-white rounded-lg px-6 py-3 btn-hover gradient-black"
                  >
                    Register
                  </button>
                </div>
              </form>

              <div
                class="text-sm font-semibold block sm:hidden py-6 flex justify-center"
              >
                <a
                  href="#"
                  class="font-normal border-b-2 border-gray-200 hover:border-teal-500"
                  >You're already member?
                  <span class="font-semibold"> Login </span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- End register tab -->
  </body>
</html>
