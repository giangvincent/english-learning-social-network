<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User setting</title>
    <link
      href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link href="main.css" rel="stylesheet" />
  </head>
  <body>
    <!--Nav-->
    <nav id="header" class="bg-white w-full z-20 top-0 fixed shadow">
      <div
        class="w-full container mx-auto flex flex-wrap items-center justify-between mt-0 px-4 py-2"
      >
        <label for="menu-toggle" class="cursor-pointer md:hidden block">
          <svg
            class="fill-current text-gray-900"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 20 20"
          >
            <title>menu</title>
            <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z"></path>
          </svg>
        </label>
        <input class="hidden" type="checkbox" id="menu-toggle" />

        <div
          class="hidden md:flex md:items-center md:w-auto w-full order-3 md:order-1"
          id="menu"
        >
          <nav>
            <ul
              class="md:flex items-center justify-between text-base text-gray-700 pt-4 md:pt-0"
            >
              <li>
                <a
                  class="inline-block no-underline hover:text-black hover:underline py-2 px-4"
                  href="#"
                  >Shop</a
                >
              </li>
              <li>
                <a
                  class="inline-block no-underline hover:text-black hover:underline py-2 px-4"
                  href="#"
                  >About</a
                >
              </li>
            </ul>
          </nav>
        </div>

        <div class="order-1 md:order-2">
          <a
            class="items-center hover:no-underline font-bold text-gray-800 text-xl uppercase"
            href="index.html"
          >
            ohitsgood
          </a>
        </div>

        <div class="order-2 md:order-3 flex items-center" id="nav-content">
          <a
            class="inline-block no-underline hover:text-black"
            href="auth.html"
          >
            <svg
              class="fill-current hover:text-black"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
            >
              <circle fill="none" cx="12" cy="7" r="3" />
              <path
                d="M12 2C9.243 2 7 4.243 7 7s2.243 5 5 5 5-2.243 5-5S14.757 2 12 2zM12 10c-1.654 0-3-1.346-3-3s1.346-3 3-3 3 1.346 3 3S13.654 10 12 10zM21 21v-1c0-3.859-3.141-7-7-7h-4c-3.86 0-7 3.141-7 7v1h2v-1c0-2.757 2.243-5 5-5h4c2.757 0 5 2.243 5 5v1H21z"
              />
            </svg>
          </a>
        </div>
      </div>
      <!-- End topbar lvl0 -->
    </nav>
    <div
      class="sm:rounded sm:rounded-t-lg shadow max-w-sm md:px-6 lg:px-8 pt-16"
    >
      <div
        class="h-40 w-full overflow-hidden bg-center bg-cover"
        style="background-image: url(images/default.jpg)"
      ></div>
      <!-- End cover image -->

      <div class="flex justify-center -mt-8">
        <img
          src="images/default_avatar.jpg"
          class="rounded-full border-solid border-white border-2 -mt-3"
        />
      </div>
      <!-- End avatar image -->
      <div class="text-center px-3 pb-6 pt-2">
        <h3 class="text-black text-sm bold font-sans">Olivia Dunham</h3>
        <p class="mt-2 font-sans font-light text-grey-dark">
          Hello, i'm from another the other side!
        </p>
      </div>
      <!-- End bio -->

      <div class="w-full mx-auto flex text-center font-bold">
        <a href="user.html" class="w-1/3 py-3">Đã đăng</a>
        <a href="user.html" class="w-1/3 py-3">Đă lưu</a>
        <a
          href="user-setting.html"
          class="w-1/3 py-3 border-b-2 border-gray-900"
          >Cài đặt</a
        >
      </div>
      <!-- END topbar lvl1 -->
    </div>
    <!-- User info -->

    <div class="my-6 md:px-6 lg:px-8 pb-20 max-w-sm mx-auto px-6">
      <form class="mt-8" x-data="{password: '',password_confirm: ''}">
        <div class="mx-auto max-w-lg">
          <div class="py-1">
            <span class="px-1 text-sm text-gray-600">Username</span>
            <input
              placeholder=""
              type="text"
              class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
            />
          </div>
          <div class="py-1">
            <span class="px-1 text-sm text-gray-600">Email</span>
            <input
              placeholder=""
              type="email"
              class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
            />
          </div>
          <div class="py-1">
            <span class="px-1 text-sm text-gray-600">Password</span>
            <input
              placeholder=""
              type="password"
              x-model="password"
              class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
            />
          </div>
          <div class="py-1">
            <span class="px-1 text-sm text-gray-600">Password Confirm</span>
            <input
              placeholder=""
              type="password"
              x-model="password_confirm"
              class="text-md block px-3 py-2 rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none"
            />
          </div>
          <div class="flex justify-start mt-3 ml-4 p-1">
            <ul>
              <li class="flex items-center py-1">
                <div
                  :class="{'bg-green-200 text-green-700': password == password_confirm && password.length > 0, 'bg-red-200 text-red-700':password != password_confirm || password.length == 0}"
                  class="rounded-full p-1 fill-current"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      x-show="password == password_confirm && password.length > 0"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M5 13l4 4L19 7"
                    />
                    <path
                      x-show="password != password_confirm || password.length == 0"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </div>
                <span
                  :class="{'text-green-700': password == password_confirm && password.length > 0, 'text-red-700':password != password_confirm || password.length == 0}"
                  class="font-medium text-sm ml-3"
                  x-text="password == password_confirm && password.length > 0 ? 'Passwords match' : 'Passwords do not match' "
                ></span>
              </li>
              <li class="flex items-center py-1">
                <div
                  :class="{'bg-green-200 text-green-700': password.length > 7, 'bg-red-200 text-red-700':password.length < 7 }"
                  class="rounded-full p-1 fill-current"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                  >
                    <path
                      x-show="password.length > 7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M5 13l4 4L19 7"
                    />
                    <path
                      x-show="password.length < 7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M6 18L18 6M6 6l12 12"
                    />
                  </svg>
                </div>
                <span
                  :class="{'text-green-700': password.length > 7, 'text-red-700':password.length < 7 }"
                  class="font-medium text-sm ml-3"
                  x-text="password.length > 7 ? 'The minimum length is reached' : 'At least 8 characters required' "
                ></span>
              </li>
            </ul>
          </div>
          <div class="flex justify-start">
            <label class="block text-gray-500 font-bold my-4 flex items-center">
              <input
                class="leading-loose text-pink-600 top-0"
                type="checkbox"
              />
              <span class="ml-2 text-sm py-2 text-gray-600 text-left"
                >Accept the
                <a
                  href="#"
                  class="font-semibold border-b-2 border-gray-200 hover:border-gray-500 text-black"
                >
                  Terms and Conditions of the site </a
                >and
                <a
                  href="#"
                  class="font-semibold border-b-2 border-gray-200 hover:border-gray-500 text-black"
                >
                  the information data policy.</a
                >
              </span>
            </label>
          </div>
          <button
            class="mt-3 text-lg font-semibold w-full text-white rounded-lg px-6 py-3 btn-hover gradient-black"
          >
            Register
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
